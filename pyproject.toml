[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "leadscrub"
version = "0.1.0"
description = "Multi-pass lead list scrubber: validate, dedupe, and remove DNC, opt-out, customer, and recently contacted leads."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "David Benner" }]
keywords = ["leads", "dnc", "csv", "sales", "data-cleaning", "tcpa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
leadscrub = "leadscrub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leadscrub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "E501"]  # line length is handled by ruff format
